         걷어낸다 — html 배경이 남아 있으면 body::before(지면 결·상단 글로우)가 가려진다. */
      try{var t=localStorage.getItem('nuri-theme')==='light';
        document.documentElement.classList.add(t?'light':'dark');
        document.documentElement.style.backgroundColor=t?'#F2F5FA':'#101823';
      }catch(e){document.documentElement.classList.add('dark');document.documentElement.style.backgroundColor='#101823'}
      /* 새로고침이면 앱은 보던 탭으로 부팅한다(src/lib/reloadTab.ts — 같은 키·같은 판정). 그 탭이 홈이 아니면 data-boot-tab 을 달아

      try{var n=performance.getEntriesByType('navigation')[0],b=n&&n.type==='reload'&&sessionStorage.getItem('nuri:reload-tab');
        if(b&&b!=='home')document.documentElement.setAttribute('data-boot-tab',b);
      }catch(e){}
    </script>

         원인(가설을 하나씩 갈라 확정): `pretendardvariable-dynamic-subset.css` 의 **92개 face 전부에 걸린
           `font-display: optional`**. dynamic-subset 은 face 를 레이아웃 중에야 발견하므로 요청이 첫 페인트
           근처에서야 출발하고, **13개 파일**의 캐시 읽기+압축 해제가 optional 의 블록 구간(~100ms)을 넘긴다.

           웜 캐시는 전부 무죄로 기각됐다 — CSS 에서 `optional` 한 단어만 `block` 으로 바꾸면 즉시 적용된다.

           (글자 폭이 바뀌어 줄바꿈·말줄임·카드 높이가 전부 움직인다). 켜려면 모바일·PC 실화면 확인이 먼저다.

           ① `public/fonts/pretendard/pretendardvariable-dynamic-subset.css` 의 `font-display: optional` → `fallback`
           ② 여기 `<head>` 에 `<link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css">` 정적 추가
           결과: 콜드 LCP 652 → **948ms** · 콜드 CLS 0.0775 → **0.0791(사실상 동일)** · 전송 321KB(지금도 받고 있던 양)

             `font-display` 탓이 아니라 **유휴 지연 주입** 탓이었다(지연 주입 + fallback 은 CLS 0.132).
             `<head>` 정적이면 교체가 첫 페인트 근처라 늦은 재레이아웃이 없다. 대가는 LCP +약 300ms 다.

         ⚠ 예전에 여기 있던 실측 표("콜드 0/10, 재방문 9/12 → 12/12")는 **전부 오염이라 지웠다.**

         ⚠ 판정 방법 주의: `document.fonts.check()` 는 **없는 폰트에도 true** 를 돌려준다(덮는 face 가 없으면 공허참).

  </head>
