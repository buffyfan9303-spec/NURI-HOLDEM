name: CI

# push(main) · PR 마다 빌드 + Playwright 스모크 자동 실행 → 깨진 배포 차단용 게이트.
# 배포를 "하드 차단"하려면: GitHub → Settings → Branches → main 브랜치 보호 규칙에
#   "Require status checks to pass" 에 이 워크플로(build-and-e2e)를 지정 + Vercel 은
#   Settings → Git → "Wait for CI before deploy" 를 켜면 됩니다(아래 README 참고).
on:
  push:
    branches: [main]
  pull_request:

# 같은 ref 의 이전 실행은 취소(최신 커밋만 검사)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Supabase 시크릿이 있으면 실데이터로, 없으면 자동으로 Mock 모드로 스모크가 돈다(둘 다 통과해야 정상)
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # 금액 계산 단위 테스트 — 매출·미수·엔트리·할인이 조합별로 정확한지 값으로 고정.
      # (2026-07 '레벨 할인' 사건: 빌드·린트·E2E 다 통과하는데 돈 계산만 조용히 틀렸던 유형 방지)
      - name: 단위 테스트 (장부 금액 계산)
        run: npm test

      - name: Build (타입체크 + 번들 + sitemap 생성)
        run: npm run build

      # 번들 예산 — 이 프로젝트가 실제로 밟은 함정 3개를 규칙으로 박은 것(scripts/bundle-budget.mjs 주석 참고).
      #   ① 구글 폰트 CSS 가 임계 경로로 돌아오는 것(실측 422→637ms 로 걷어냈던 그것)
      #   ② 낡은 dist 를 재고 "포함됐다"고 오판하는 것
      #   ③ 청크가 조용히 불어나는 것
      # 의도한 증가면 `npm run bundle:budget:update` 로 올리고 **왜 올렸는지 커밋에 남긴다.**
      - name: 번들 예산
        run: npm run bundle:budget

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # E2E 는 두 단계다(package.json 참고).
      #   ① main — 병렬. 기능·회귀 전반.
      #   ② boot(@boot) — 단일 워커. '무엇이 먼저 출발했는가' 를 재는 부팅 경쟁 테스트라
      #      워커가 CPU 를 다투면 측정 대상 자체가 왜곡된다. 끄지 않고 분리해서 돌린다.
      # 자격증명이 있으면 인증 스모크·클락 워치독까지 실제로 돈다(없으면 그 스펙만 skip).
      - name: E2E 스모크 (기능 + 부팅 예산)
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: 리포트 업로드(실패 시 추적)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
