name: DB Backup to R2

# OBS-1 — 무료 Supabase는 자동 백업·PITR이 없다. 야간 pg_dump → Cloudflare R2(S3 호환).
# 라이브 DB는 읽기(dump)만.
#
# ⚠ 2026-09-09 — "필수 secret 없으면 우아하게 스킵"을 폐기했다.
#   2026-08-24 이후 매일 03:00 KST 에 초록불이 켜졌지만 **실제 백업은 0건**이었다.
#   SUPABASE_DB_URL 이 한 번도 설정되지 않아 첫 단계에서 SKIP=1 을 세우고 나머지를 전부 건너뛰었고,
#   워크플로는 그것을 success 로 보고했다(실행 34276700212 로그: `DB_URL:` 빈 값 → "백업 스킵").
#   백업이 없는 상태를 초록으로 위장하는 것이 가장 위험한 실패 모드라, 이제 누락은 **실패**다.
#   값은 어떤 경우에도 로그에 남기지 않는다 — 이름만 말한다.
on:
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC = 03:00 KST 매일
  workflow_dispatch:        # 수동 실행(테스트)

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — 필수 secret 확인(하나라도 없으면 실패)
        env:
          # 접속 문자열 secret 이름은 둘 다 받는다 — 오너가 SUPABASE_URI 로 등록해 두었는데
          # 워크플로가 SUPABASE_DB_URL 만 보고 있어 등록해도 계속 스킵되던 것을 2026-09-10 에 잡았다.
          # 우선순위: SUPABASE_DB_URL > SUPABASE_URI. 값은 어디에도 출력하지 않는다.
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_URL_ALT: ${{ secrets.SUPABASE_URI }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          URL="${DB_URL:-$DB_URL_ALT}"
          # R2 값의 '모양'만 진단한다(값은 절대 출력하지 않는다) — 실행 34475100193 까지 세 번 연속
          # "SSL handshake failure" 였고, 그 원인은 십중팔구 계정 ID 가 아닌 값(토큰 ID·액세스 키·r2.dev 주소)이
          # R2_ACCOUNT_ID/R2_ENDPOINT 에 들어간 것이다. 오너가 대시보드에서 어느 값을 다시 넣어야 하는지 여기서 드러난다.
          shape() { printf '%s' "$1" | grep -Eq "$2" && echo "OK" || echo "다름"; }
          echo "R2_ACCOUNT_ID: 길이 ${#R2_ACCOUNT_ID} · 32자리 16진수 모양=$(shape "$R2_ACCOUNT_ID" '^[0-9a-f]{32}$')  (Cloudflare 대시보드 R2 → 우측 'Account ID')"
          echo "R2_ENDPOINT: 길이 ${#R2_ENDPOINT} · https://<32hex>.r2.cloudflarestorage.com 모양=$(shape "$R2_ENDPOINT" '^https://[0-9a-f]{32}(\.[a-z]+)?\.r2\.cloudflarestorage\.com/?$')"
          echo "R2_BUCKET: 길이 ${#R2_BUCKET} · 소문자·숫자·하이픈만=$(shape "$R2_BUCKET" '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$')"
          echo "R2_ACCESS_KEY_ID: 길이 ${#R2_ACCESS_KEY_ID} (32) · R2_SECRET_ACCESS_KEY: 길이 ${#R2_SECRET_ACCESS_KEY} (64)"
          missing=""
          [ -z "$URL" ]                 && missing="$missing SUPABASE_DB_URL(또는 SUPABASE_URI)"
          [ -z "$R2_ACCESS_KEY_ID" ]    && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$R2_SECRET_ACCESS_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "$R2_ENDPOINT" ]         && missing="$missing R2_ENDPOINT"
          [ -z "$R2_BUCKET" ]           && missing="$missing R2_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error::백업 실행 불가 — 필수 secret 누락:$missing. 오너가 'gh secret set <이름>' 으로 설정해야 한다(접속 문자열은 세션 풀러 5432 URL). 값은 여기 출력하지 않는다."
            exit 1
          fi
          # 모양 검사 — 프로젝트 API 주소(https://xxx.supabase.co)를 붙여 넣는 실수를 여기서 잡는다.
          # 값 자체는 출력하지 않고 접두사만 본다.
          case "$URL" in
            postgres://*|postgresql://*) : ;;
            *)
              echo "::error::접속 문자열이 postgres:// 로 시작하지 않는다 — Supabase 대시보드 Connect → Direct 탭의 **Session pooler(5432) URI** 를 넣어야 한다(프로젝트 API 주소가 아니다). 값은 출력하지 않는다."
              exit 1 ;;
          esac
          case "$URL" in
            *:6543/*) echo "::warning::포트 6543(트랜잭션 풀러)이다 — pg_dump 가 실패할 수 있다. 세션 풀러 5432 를 권장한다." ;;
          esac
          # R2 엔드포인트 모양 검사(실행 34474586540: 덤프는 됐는데 업로드가 "SSL handshake failure" 로 죽었다 —
          # 호스트가 계정ID.r2.cloudflarestorage.com 이 아니면 Cloudflare 가 TLS 단계에서 끊는다. 값은 출력하지 않는다).
          case "$R2_ENDPOINT" in
            https://[0-9a-f]*.r2.cloudflarestorage.com|https://[0-9a-f]*.r2.cloudflarestorage.com/|https://[0-9a-f]*.*.r2.cloudflarestorage.com|https://[0-9a-f]*.*.r2.cloudflarestorage.com/) : ;;
            *) echo "::warning::R2_ENDPOINT 가 https://<계정ID>.r2.cloudflarestorage.com 모양이 아니다(버킷 이름·경로·r2.dev 공개 주소가 섞였을 수 있다). 업로드 단계에서 R2_ACCOUNT_ID 로 만든 주소를 먼저 쓴다." ;;
          esac
          echo "필수 secret 5개 확인 완료(이름만 검사) · 접속 문자열 모양 확인 완료"

      - name: PostgreSQL 17 client 설치
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: pg_dump → gzip
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_URL_ALT: ${{ secrets.SUPABASE_URI }}
        run: |
          STAMP="$(date -u +%Y%m%d-%H%M)"
          URL="${DB_URL:-$DB_URL_ALT}"
          # ⚠ 2026-09-10 실측(실행 34473708702): 오너가 넣은 접속 문자열은 **직접 접속 호스트**
          #   (db.<ref>.supabase.co)였고, 그 호스트는 IPv6 전용이라 GitHub 러너(IPv4)에서
          #   "Network is unreachable" 로 첫 실제 백업이 실패했다 — 즉 지금까지 성공한 백업은 0건이다.
          #   secret 값을 바꾸는 건 오너 몫이지만, 워크플로가 스스로 세션 풀러(IPv4·5432)로 바꿔 시도하면
          #   값을 손대지 않고도 백업이 된다. 풀러 계정은 `postgres.<ref>`, 비밀번호는 같다.
          #   풀러 클러스터(aws-0/aws-1)는 대시보드에서만 보이므로 둘 다 시도해 붙는 쪽을 쓴다.
          #   값(비밀번호)은 어떤 경우에도 출력하지 않는다 — 호스트 이름만 남긴다.
          if printf '%s' "$URL" | grep -qE '@db\.[a-z0-9]+\.supabase\.co(:[0-9]+)?/'; then
            REF="$(printf '%s' "$URL" | sed -E 's#.*@db\.([a-z0-9]+)\.supabase\.co.*#\1#')"
            CRED="$(printf '%s' "$URL" | sed -E 's#^postgres(ql)?://([^@]*)@.*#\2#')"
            PASS="${CRED#*:}"
            DBPATH="$(printf '%s' "$URL" | sed -E 's#.*@db\.[a-z0-9]+\.supabase\.co(:[0-9]+)?/##')"
            CANDIDATES="$URL postgresql://postgres.$REF:$PASS@aws-0-ap-northeast-2.pooler.supabase.com:5432/$DBPATH postgresql://postgres.$REF:$PASS@aws-1-ap-northeast-2.pooler.supabase.com:5432/$DBPATH"
          else
            CANDIDATES="$URL"
          fi
          USE=""
          for C in $CANDIDATES; do
            HOST="$(printf '%s' "$C" | sed -E 's#^[^@]*@([^:/]+).*#\1#')"
            if psql "$C" -Atc 'select 1' >/dev/null 2>&1; then USE="$C"; echo "접속 확인: $HOST"; break; fi
            echo "접속 실패: $HOST — 다음 후보"
          done
          if [ -z "$USE" ]; then
            echo "::error::어느 호스트로도 DB 에 붙지 못했다(직접 접속·세션 풀러 aws-0/aws-1). 오너가 대시보드 Connect → Session pooler URI 로 secret 을 갱신해야 한다. 값은 출력하지 않는다."
            exit 1
          fi
          # ⚠ 버전을 못 박는다(실행 34474120866): 러너에 이미 있던 pg_dump 16 이 PATH 를 잡아
          #   "server version mismatch"(서버 17.6) 로 실패했다. 위에서 설치한 17 바이너리를 직접 부른다.
          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PGDUMP" --version
          "$PGDUMP" --format=custom --no-owner --no-privileges "$USE" -f "nuri-$STAMP.dump"
          gzip "nuri-$STAMP.dump"
          echo "FILE=nuri-$STAMP.dump.gz" >> "$GITHUB_ENV"
          ls -lh "nuri-$STAMP.dump.gz"

      - name: R2 업로드(S3) — 버킷 없으면 생성
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # ubuntu 러너엔 aws-cli v2 기본 설치. R2는 S3 호환.
          # 엔드포인트는 계정 ID 로 만든 정본(https://<id>.r2.cloudflarestorage.com)을 먼저 쓴다 —
          # 실행 34474586540 에서 R2_ENDPOINT 값으로는 TLS 핸드셰이크가 실패했다(값은 출력하지 않는다).
          EP="$ENDPOINT"
          if [ -n "$ACCOUNT_ID" ]; then EP="https://$ACCOUNT_ID.r2.cloudflarestorage.com"; fi
          echo "R2 엔드포인트 출처: $([ -n "$ACCOUNT_ID" ] && echo R2_ACCOUNT_ID || echo R2_ENDPOINT)"
          echo "EP=$EP" >> "$GITHUB_ENV"
          aws s3api head-bucket --bucket "$BUCKET" --endpoint-url "$EP" 2>/dev/null \
            || aws s3api create-bucket --bucket "$BUCKET" --endpoint-url "$EP"
          aws s3 cp "$FILE" "s3://$BUCKET/db/$FILE" --endpoint-url "$EP"

      # 업로드 명령이 0 을 돌려줘도 객체가 실제로 있는지 다시 읽는다 — "성공" 은 R2 에 객체가 존재한다는 뜻이어야 한다.
      - name: R2 객체 존재·크기 검증
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          SIZE="$(aws s3api head-object --bucket "$BUCKET" --key "db/$FILE" --endpoint-url "${EP:-$ENDPOINT}" --query ContentLength --output text)"
          LOCAL="$(stat -c %s "$FILE")"
          echo "R2 객체 크기: $SIZE bytes / 로컬: $LOCAL bytes"
          if [ -z "$SIZE" ] || [ "$SIZE" != "$LOCAL" ] || [ "$SIZE" -le 0 ]; then
            echo "::error::업로드된 객체 크기가 로컬 덤프와 다르거나 0 — 백업 실패로 처리"
            exit 1
          fi
          echo "::notice::백업 업로드 완료 — s3://$BUCKET/db/$FILE ($SIZE bytes)"

      # (선택) 하트비트 — Healthchecks.io URL을 secret으로 넣으면 활성. 성공했을 때만 친다(실패는 알림으로 드러나야 한다).
      - name: Heartbeat ping(선택)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_BACKUP_URL }}
        run: |
          if [ -n "$HC_URL" ]; then curl -fsS -m 10 "$HC_URL" >/dev/null || true; fi
