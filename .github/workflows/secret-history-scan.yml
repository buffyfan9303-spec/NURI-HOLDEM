name: 비밀 유출 이력 전체 스캔(주간)

# ci.yml 의 gitleaks-action 은 **이벤트 범위(푸시·PR 의 커밋)만** 본다 — main 푸시에서
# '0 commits scanned' 가 나온 적이 있다(2026-10-03 critical-reviewer E4). 공개 저장소는
# 이력이 곧 공개라서, 이미 들어간 비밀을 잡으려면 **모든 브랜치의 전 이력**을 따로 훑어야 한다.
# 이 워크플로가 그 일을 한다. 주 1회 + 수동 실행. 발견 시 잡이 실패한다(= 키 로테이션 먼저).
#
# 허용 목록은 기존 것을 그대로 쓴다: .gitleaks.toml(공개 키 allowlist) · .gitleaksignore(커밋별 지문).
# 새 예외는 거기에만 추가한다(이 파일에 --exclude 류를 넣지 않는다).

on:
  schedule:
    - cron: '0 19 * * 1'   # 매주 화요일 04:00 KST
  workflow_dispatch:        # 수동 실행 — 비밀 유출 의심·키 로테이션 직후에 한 번 돌려 보기 좋다
  push:                     # 이 파일·허용 목록을 고치면 그 브랜치에서 바로 돌려 본다(기본 브랜치에 들어가기 전엔 수동 실행이 안 된다)
    paths: ['.github/workflows/secret-history-scan.yml', '.gitleaks.toml', '.gitleaksignore']

permissions:
  contents: read

jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 전 이력
      # checkout 은 기준 브랜치만 받는다. --all 이 다른 브랜치 이력까지 보게 원격 브랜치를 모두 받는다.
      - name: 원격 브랜치 전부 받기
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      # 공식 릴리스 바이너리 · 버전 고정 · 체크섬 검증(gitleaks-action 은 이벤트 범위만 보고, 조직 라이선스 변수도 있어 쓰지 않는다).
      #   sha256 은 릴리스의 gitleaks_8.30.1_checksums.txt 값(2026-10-03). 버전을 올릴 때 두 값을 같이 바꾼다.
      - name: gitleaks 8.30.1 설치
        env:
          VER: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: gitleaks 전체 이력 스캔
        run: ./gitleaks git . --config .gitleaks.toml --log-opts="--all" --redact --verbose --exit-code 1
