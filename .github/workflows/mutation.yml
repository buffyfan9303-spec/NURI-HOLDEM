name: 뮤테이션 검증(주간)

# 테스트가 **진짜 잡는지** 확인한다. 통과하는 테스트 수는 안전의 증거가 아니다 —
# 깨뜨렸을 때 실패하는가가 증거다.
#
# 이 프로젝트에는 "통과하는데 아무것도 안 지키는" 테스트가 실제로 있었다
# (e2e/design-tokens.spec.ts 주석: "회귀 주입 실험에서 이 테스트만 못 잡았다").
#
# 왜 매 커밋이 아니라 주간인가: 뮤턴트 하나마다 테스트를 다시 돌려야 해서 느리다.
# PR 을 막는 게이트로 쓰면 사람들이 게이트를 미워하게 되고, 미움받는 게이트는 결국 꺼진다.
# 주간으로 돌려 **추세**를 본다(사살률이 떨어지면 테스트가 형해화되고 있다는 뜻).

on:
  schedule:
    - cron: '0 18 * * 0'   # 매주 일요일 03:00 KST
  workflow_dispatch:        # 수동 실행 — 큰 리팩터 뒤에 한 번 돌려 보기 좋다

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 2026-09-20 — node 22→24. 근거는 ci.yml 의 setup-node 주석 참조(같은 조사,
          #   중복 생략). 이 워크플로는 주간·비차단이라 위험이 가장 낮은 자리부터 올렸다.
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci

      # --ci 를 주지 않는다: 생존자가 있다고 실패시키지 않는다.
      #   방어적 분기·도달 불가 경로는 원래 생존하고, 그걸 0 으로 만들려는 압력은
      #   '테스트를 위한 테스트' 를 낳는다. 숫자를 보고 사람이 판단한다.
      - name: 뮤테이션 검증
        run: npm run test:mutation
