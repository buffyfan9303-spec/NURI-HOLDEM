# DEV-3 — 의존성 보안·호환 자동 유지. 그룹 PR로 1인 개발 소음 최소화, 보안 패치는 즉시.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # minor/patch는 주 1회 단일 PR로 묶어 소음 최소화(보안 업데이트는 그룹과 무관하게 즉시)
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # 20-ⓐ 오너 결정(2026-09-21) — Tailwind 는 3.4 에 고정한다.
      #   v4 는 PostCSS 진입점(tailwindcss → @tailwindcss/postcss)과 설정 형식이 바뀌어
      #   순수 버전 범프로는 적용되지 않고, 이 저장소는 색을 CSS 변수 토큰으로 받아 쓰므로
      #   (tailwind.config.js 의 rgb(var(--surface-*) / <alpha-value>)) 색 회귀 위험이 크다.
      #   필요해지면 별도 브랜치에서 e2e/design-tokens 전후 대조를 붙여 연다.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
